[project]
name = "qa"
version = "0.1.0"
description = "QA checks and reports"
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.12.5",
    "arxiv-base",
    "fasttext-langdetect>=1.1.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff",
    "ty",
]

[tool.uv]
default-groups = ["dev"]

[tool.uv.sources]
arxiv-base = { git = "https://github.com/arXiv/arxiv-base", branch = "master" }

# do not install arxiv-base deps
[[tool.uv.dependency-metadata]]
name = "arxiv-base"
version = "1.0.1"   # required
requires-dist = []

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
omit = ["*/__init__.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
