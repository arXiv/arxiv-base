name: Run Python Tests
on:
  pull_request:
    paths-ignore:
      - "qa/**"
      - "arxiv-functions/**"
      
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install Python 3
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y protobuf-compiler
          protoc --version        
          python -m pip install --upgrade pip
          python -m pip install poetry
          pip --version
          poetry --version
          # Check if poetry lock file is current with pyproject.toml
          poetry check --lock
          # Must be able to install without QA/gcld3/protobuf-compile
          poetry install --with=dev --no-ansi
          # Install with QA/gcld3
          poetry install --with=dev --no-ansi --extras qa

      - name: Run /tests
        run: |
          poetry run pytest tests

      - name: Run db/test with MySQL docker
        run: |
          sudo apt update
          sudo apt install -y mysql-client
          cd arxiv && poetry run pytest auth/legacy/tests --db=mysql

      - name: Run arxiv-base tests with coverage
        run: |
          poetry run pytest --cov=arxiv arxiv
          poetry run pytest --cov=fourohfour fourohfour --cov-append
          poetry run coverage html

      # - name: Check Types
      # TODO The types are in bad shape and need to be fixed
      #   run: poetry run mypy --exclude "test*" -p arxiv

      - name: Check coverage thresholds
        run: |
          poetry run coverage report --include="arxiv/base/*" --fail-under=85
          poetry run coverage report --include="fourohfour/*" --fail-under=74
          poetry run coverage report --include="arxiv/*" --fail-under=82
      
      #- name: Check Doc Style
      #  run: poetry run pydocstyle --convention=numpy --add-ignore=D401 arxiv

      - name: Run App Tests
        run: poetry run python tests/run_app_tests.py

      - name: Upload coverage HTML report
        uses: actions/upload-artifact@v4
        # when running "gh act", this step cannot be executed as this is running locally
        if: success() && !env.ACT
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 30

