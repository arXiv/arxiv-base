[project]
name = "consistency-checks"
version = "0.1.0"
description = "Scheduled consistency checks for the arXiv DB and data bucket (replaces arxiv-bin Perl cron checks)"
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "arxiv-base",
    "arxiv-functions",
    "google-cloud-storage>=3.4.1",
    "mysqlclient>=2.1",
    "sqlalchemy>=2.0.27",
]

[tool.uv.sources]
arxiv-base = { path = "..", editable = true }
arxiv-functions = { path = "../arxiv-functions", editable = true }

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov>=7.1.0",
    "ruff",
    "ty",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]

[project.scripts]
consistency-checks = "consistency_checks.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
